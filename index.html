<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Manga Marketplace — a collector-minded place to buy, sell, bundle, and trade manga."
    />
    <meta name="theme-color" content="#f7f2e7" />
    <script>
      ;(() => {
        const savedTheme = localStorage.getItem('manga-market-theme')
        const theme =
          savedTheme === 'light' || savedTheme === 'dark'
            ? savedTheme
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
      })()
    </script>
    <title>Manga Marketplace — Buy, Sell & Trade</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
